<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="#{admin.users.title}">ユーザー管理</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body class="bg-light">
    <header class="bg-dark text-white py-3 mb-4">
      <div class="container d-flex justify-content-between align-items-center">
        <h1 class="h5 mb-0" th:text="#{admin.users.title}">ユーザー管理</h1>
        <a class="btn btn-outline-light btn-sm" th:href="@{/todos}" th:text="#{admin.users.toTodos}">ToDo一覧へ</a>
      </div>
    </header>

    <main class="container">
      <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}">更新しました</div>
      <div class="table-responsive">
        <table class="table table-striped align-middle">
          <thead>
            <tr>
              <th th:text="#{admin.users.id}">ID</th>
              <th th:text="#{admin.users.username}">ユーザー名</th>
              <th th:text="#{admin.users.role}">ロール</th>
              <th th:text="#{admin.users.enabled}">有効</th>
              <th th:text="#{admin.users.action}">操作</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="u : ${users}">
              <td th:text="${u.id}">1</td>
              <td th:text="${u.username}">user</td>
              <td th:text="${u.role}">USER</td>
              <td th:text="${u.enabled}">true</td>
              <td>
                <a class="btn btn-sm btn-outline-primary" th:href="@{/admin/users/{id}/edit(id=${u.id})}" th:text="#{admin.users.edit}">編集</a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </body>
</html>
