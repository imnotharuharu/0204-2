<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>監査ログ</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body class="bg-light">
    <header class="bg-dark text-white py-3 mb-4">
      <div class="container d-flex justify-content-between align-items-center">
        <h1 class="h3 mb-0">監査ログ</h1>
        <div class="d-flex gap-2">
          <a class="btn btn-outline-light btn-sm" th:href="@{/todos}">ToDo一覧へ</a>
          <form th:action="@{/logout}" method="post" class="d-inline">
            <button type="submit" class="btn btn-outline-light btn-sm">ログアウト</button>
          </form>
        </div>
      </div>
    </header>

    <main class="container">
      <form class="row g-2 mb-3" th:action="@{/admin/audit-logs}" method="get">
        <div class="col-sm-4">
          <input class="form-control" type="text" name="action" placeholder="Action" th:value="${action}" />
        </div>
        <div class="col-sm-4">
          <input class="form-control" type="text" name="entityType" placeholder="Entity Type" th:value="${entityType}" />
        </div>
        <div class="col-auto">
          <button type="submit" class="btn btn-outline-primary">検索</button>
        </div>
      </form>

      <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
          <thead class="table-light">
            <tr>
              <th>ID</th>
              <th>日時</th>
              <th>Action</th>
              <th>Entity</th>
              <th>Entity ID</th>
              <th>User ID</th>
              <th>IP</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="log : ${logs.content}">
              <td th:text="${log.id}">1</td>
              <td th:text="${#temporals.format(log.createdAt, 'yyyy/MM/dd HH:mm:ss')}">2026/02/06</td>
              <td th:text="${log.action}">UPDATE</td>
              <td th:text="${log.entityType}">Todo</td>
              <td th:text="${log.entityId}">10</td>
              <td th:text="${log.userId}">1</td>
              <td th:text="${log.ipAddress}">127.0.0.1</td>
            </tr>
          </tbody>
        </table>
      </div>

      <nav aria-label="pagination" th:if="${logs.totalPages > 1}">
        <ul class="pagination justify-content-center mt-3">
          <li class="page-item" th:classappend="${logs.first} ? ' disabled' : ''">
            <a
              class="page-link"
              th:href="@{/admin/audit-logs(page=${logs.number - 1}, size=${logs.size}, action=${action}, entityType=${entityType})}"
            >
              Prev
            </a>
          </li>
          <li
            class="page-item"
            th:each="p : ${#numbers.sequence(1, logs.totalPages)}"
            th:classappend="${p - 1 == logs.number} ? ' active' : ''"
          >
            <a
              class="page-link"
              th:href="@{/admin/audit-logs(page=${p - 1}, size=${logs.size}, action=${action}, entityType=${entityType})}"
              th:text="${p}"
            >
              1
            </a>
          </li>
          <li class="page-item" th:classappend="${logs.last} ? ' disabled' : ''">
            <a
              class="page-link"
              th:href="@{/admin/audit-logs(page=${logs.number + 1}, size=${logs.size}, action=${action}, entityType=${entityType})}"
            >
              Next
            </a>
          </li>
        </ul>
      </nav>
    </main>
  </body>
</html>
