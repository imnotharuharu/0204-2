<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="#{admin.user.edit.title}">ユーザー編集</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body class="bg-light">
    <header class="bg-dark text-white py-3 mb-4">
      <div class="container d-flex justify-content-between align-items-center">
        <h1 class="h5 mb-0" th:text="#{admin.user.edit.title}">ユーザー編集</h1>
        <a class="btn btn-outline-light btn-sm" th:href="@{/admin/users}" th:text="#{admin.user.edit.back}">一覧へ</a>
      </div>
    </header>

    <main class="container">
      <form th:action="@{/admin/users/{id}(id=${user.id})}" method="post" class="card p-4 shadow-sm">
        <div class="mb-3">
          <label class="form-label" th:text="#{admin.users.username}">ユーザー名</label>
          <input type="text" class="form-control" th:value="${user.username}" readonly />
        </div>
        <div class="mb-3">
          <label class="form-label" th:text="#{admin.users.role}">ロール</label>
          <select class="form-select" name="role">
            <option value="USER" th:selected="${user.role == 'USER'}">USER</option>
            <option value="ADMIN" th:selected="${user.role == 'ADMIN'}">ADMIN</option>
          </select>
        </div>
        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" name="enabled" id="enabled" th:checked="${user.enabled}" />
          <label class="form-check-label" for="enabled" th:text="#{admin.users.enabled}">有効</label>
        </div>
        <button type="submit" class="btn btn-primary" th:text="#{admin.user.edit.update}">更新</button>
      </form>
    </main>
  </body>
</html>
