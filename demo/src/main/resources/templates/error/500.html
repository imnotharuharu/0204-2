<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="#{error.500.title}">500 Internal Server Error</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body class="bg-light">
    <main class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
      <div class="text-center">
        <h1 class="display-6 mb-3" th:text="#{error.500.title}">エラーが発生しました</h1>
        <p class="text-muted" th:text="${message} ?: #{error.500.message}">しばらくしてから再度お試しください。</p>
        <a class="btn btn-primary" th:href="@{/todos}" th:text="#{error.back}">ToDo一覧へ</a>
      </div>
    </main>
  </body>
</html>
