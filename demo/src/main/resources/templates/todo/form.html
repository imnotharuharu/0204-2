<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ToDo 入力</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body class="bg-light">
    <header class="bg-dark text-white py-3 mb-4">
      <div class="container">
        <h1 class="h3 mb-0">ToDo App</h1>
      </div>
    </header>

    <main class="container">
      <h2 class="h4 mb-3">ToDo 入力</h2>

      <form th:action="@{/todos/confirm}" method="post" class="card p-4 shadow-sm">
        <input type="hidden" name="id" th:value="${todoForm != null} ? ${todoForm.id} : ''" />
        <div class="mb-3">
          <label for="title" class="form-label">タイトル</label>
          <input
            type="text"
            class="form-control"
            id="title"
            name="title"
            required
            placeholder="例: レポート提出"
            th:value="${todoForm != null} ? ${todoForm.title} : ''"
          />
        </div>

        <div class="mb-3">
          <label for="description" class="form-label">説明</label>
          <textarea
            class="form-control"
            id="description"
            name="description"
            rows="4"
            placeholder="任意"
            th:text="${todoForm != null} ? ${todoForm.description} : ''"
          ></textarea>
        </div>

        <div class="mb-3">
          <label for="priority" class="form-label">優先度</label>
          <select class="form-select" id="priority" name="priority">
            <option value="1" th:selected="${todoForm == null or todoForm.priority == null or todoForm.priority == 1}">1</option>
            <option value="2" th:selected="${todoForm != null and todoForm.priority == 2}">2</option>
            <option value="3" th:selected="${todoForm != null and todoForm.priority == 3}">3</option>
            <option value="4" th:selected="${todoForm != null and todoForm.priority == 4}">4</option>
            <option value="5" th:selected="${todoForm != null and todoForm.priority == 5}">5</option>
          </select>
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary">確認</button>
          <a class="btn btn-secondary" th:href="@{/todos}">戻る</a>
        </div>
      </form>
    </main>
  </body>
</html>
