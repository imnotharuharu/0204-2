<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="#{form.title}">ToDo 入力</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body class="bg-light">
    <header class="bg-dark text-white py-3 mb-4">
      <div class="container">
        <h1 class="h3 mb-0" th:text="#{app.title}">ToDo App</h1>
      </div>
    </header>

    <main class="container">
      <h2 class="h4 mb-3" th:text="#{form.title}">ToDo 入力</h2>

      <form
        th:action="${todoForm != null and todoForm.id != null} ? @{/todos/{id}/update(id=${todoForm.id})} : @{/todos/confirm}"
        th:object="${todoForm}"
        method="post"
        class="card p-4 shadow-sm"
      >
        <input type="hidden" name="id" th:value="${todoForm != null} ? ${todoForm.id} : ''" />
        <input type="hidden" name="version" th:value="${todoForm != null} ? ${todoForm.version} : ''" />
        <div class="mb-3">
          <label for="author" class="form-label" th:text="#{form.author}">作成者</label>
          <input
            type="text"
            class="form-control"
            id="author"
            name="author"
            required
            placeholder="例: 山田 太郎"
            th:value="${todoForm != null} ? ${todoForm.author} : ''"
          />
          <div class="text-danger small mt-1" th:if="${#fields.hasErrors('author')}" th:errors="*{author}"></div>
        </div>
        <div class="mb-3">
          <label for="title" class="form-label" th:text="#{form.title.label}">タイトル</label>
          <input
            type="text"
            class="form-control"
            id="title"
            name="title"
            required
            placeholder="例: レポート提出"
            th:value="${todoForm != null} ? ${todoForm.title} : ''"
          />
          <div class="text-danger small mt-1" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
        </div>

        <div class="mb-3">
          <label for="detail" class="form-label" th:text="#{form.detail}">詳細</label>
          <textarea
            class="form-control"
            id="detail"
            name="detail"
            rows="4"
            placeholder="任意"
            th:text="${todoForm != null} ? ${todoForm.detail} : ''"
          ></textarea>
          <div class="text-danger small mt-1" th:if="${#fields.hasErrors('detail')}" th:errors="*{detail}"></div>
        </div>
        <div class="mb-3">
          <label for="deadline" class="form-label" th:text="#{form.deadline}">期限日</label>
          <input
            type="date"
            class="form-control"
            id="deadline"
            name="deadline"
            th:value="${todoForm != null and todoForm.deadline != null} ? ${#temporals.format(todoForm.deadline, 'yyyy-MM-dd')} : ''"
          />
        </div>
        <div class="mb-3">
          <label for="priority" class="form-label" th:text="#{form.priority}">優先度</label>
          <select class="form-select" id="priority" name="priority">
            <option
              th:each="p : ${T(com.example.demo.entity.Priority).values()}"
              th:value="${p}"
              th:text="${p.label}"
              th:selected="${todoForm != null and todoForm.priority == p}"
            >
              中
            </option>
          </select>
          <div class="text-danger small mt-1" th:if="${#fields.hasErrors('priority')}" th:errors="*{priority}"></div>
        </div>
        <div class="mb-3">
          <label for="categoryId" class="form-label" th:text="#{form.category}">カテゴリ</label>
          <select class="form-select" id="categoryId" name="categoryId">
            <option value="" th:text="#{category.unset}">未選択</option>
            <option
              th:each="c : ${categories}"
              th:value="${c.id}"
              th:text="${c.name}"
              th:selected="${todoForm != null and todoForm.categoryId == c.id}"
            >
              カテゴリ
            </option>
          </select>
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary" th:text="${todoForm != null and todoForm.id != null} ? #{form.update} : #{form.confirm}">確認</button>
          <a class="btn btn-secondary" th:href="@{/todos}" th:text="#{form.back}">戻る</a>
        </div>
      </form>

      <div class="mt-4" th:if="${todoForm != null and todoForm.id != null}">
        <h3 class="h6 mb-2">添付ファイル</h3>
        <form th:action="@{/todos/{id}/attachments(id=${todoForm.id})}" method="post" enctype="multipart/form-data" class="d-flex gap-2 mb-3">
          <input type="file" class="form-control" name="file" required />
          <button type="submit" class="btn btn-outline-primary">アップロード</button>
        </form>

        <div th:if="${attachments != null and !#lists.isEmpty(attachments)}" class="list-group">
          <div class="list-group-item d-flex justify-content-between align-items-center" th:each="att : ${attachments}">
            <div>
              <a th:href="@{/todos/attachments/{id}(id=${att.id})}" th:text="${att.originalFilename}">file</a>
              <span class="text-muted small ms-2" th:text="${att.size} + ' bytes'">0 bytes</span>
            </div>
            <form th:action="@{/todos/attachments/{id}/delete(id=${att.id})}" method="post" class="d-inline">
              <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('削除しますか？')">削除</button>
            </form>
          </div>
        </div>
        <div th:if="${attachments == null or #lists.isEmpty(attachments)}" class="text-muted small">添付ファイルはありません。</div>
      </div>
    </main>
  </body>
</html>
