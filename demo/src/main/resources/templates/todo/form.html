<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ToDo 入力</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body class="bg-light">
    <header class="bg-dark text-white py-3 mb-4">
      <div class="container">
        <h1 class="h3 mb-0">ToDo App</h1>
      </div>
    </header>

    <main class="container">
      <h2 class="h4 mb-3">ToDo 入力</h2>

      <form
        th:action="${todoForm != null and todoForm.id != null} ? @{/todos/{id}/update(id=${todoForm.id})} : @{/todos/confirm}"
        th:object="${todoForm}"
        method="post"
        class="card p-4 shadow-sm"
      >
        <input type="hidden" name="id" th:value="${todoForm != null} ? ${todoForm.id} : ''" />
        <input type="hidden" name="version" th:value="${todoForm != null} ? ${todoForm.version} : ''" />
        <div class="mb-3">
          <label for="author" class="form-label">作成者</label>
          <input
            type="text"
            class="form-control"
            id="author"
            name="author"
            required
            placeholder="例: 山田 太郎"
            th:value="${todoForm != null} ? ${todoForm.author} : ''"
          />
          <div class="text-danger small mt-1" th:if="${#fields.hasErrors('author')}" th:errors="*{author}"></div>
        </div>
        <div class="mb-3">
          <label for="title" class="form-label">タイトル</label>
          <input
            type="text"
            class="form-control"
            id="title"
            name="title"
            required
            placeholder="例: レポート提出"
            th:value="${todoForm != null} ? ${todoForm.title} : ''"
          />
          <div class="text-danger small mt-1" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
        </div>

        <div class="mb-3">
          <label for="detail" class="form-label">詳細</label>
          <textarea
            class="form-control"
            id="detail"
            name="detail"
            rows="4"
            placeholder="任意"
            th:text="${todoForm != null} ? ${todoForm.detail} : ''"
          ></textarea>
          <div class="text-danger small mt-1" th:if="${#fields.hasErrors('detail')}" th:errors="*{detail}"></div>
        </div>

        <div class="mb-3">
          <label for="priority" class="form-label">優先度</label>
          <select class="form-select" id="priority" name="priority">
            <option
              th:each="p : ${T(com.example.demo.entity.Priority).values()}"
              th:value="${p}"
              th:text="${p.label}"
              th:selected="${todoForm != null and todoForm.priority == p}"
            >
              中
            </option>
          </select>
          <div class="text-danger small mt-1" th:if="${#fields.hasErrors('priority')}" th:errors="*{priority}"></div>
        </div>
        <div class="mb-3">
          <label for="categoryId" class="form-label">カテゴリ</label>
          <select class="form-select" id="categoryId" name="categoryId">
            <option value="">未選択</option>
            <option
              th:each="c : ${categories}"
              th:value="${c.id}"
              th:text="${c.name}"
              th:selected="${todoForm != null and todoForm.categoryId == c.id}"
            >
              カテゴリ
            </option>
          </select>
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary" th:text="${todoForm != null and todoForm.id != null} ? '更新' : '確認'">
            確認
          </button>
          <a class="btn btn-secondary" th:href="@{/todos}">戻る</a>
        </div>
      </form>
    </main>
  </body>
</html>
