<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="#{list.title}">ToDo List</title>
    <style>
      .overdue-row {
        background-color: #f8d7da;
      }
      .warning-row {
        background-color: #fff3cd;
      }
    </style>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body class="bg-light">
    <header class="bg-dark text-white py-3 mb-4">
      <div class="container d-flex justify-content-between align-items-center">
        <h1 class="h3 mb-0" th:text="#{app.title}">ToDo App</h1>
        <div class="d-flex gap-2">
          <a sec:authorize="hasRole('ADMIN')" class="btn btn-outline-light btn-sm" th:href="@{/admin/users}" th:text="#{nav.admin}">
            ユーザー管理
          </a>
          <a class="btn btn-outline-light btn-sm" th:href="@{?lang=ja}" th:text="#{nav.language.ja}">日本語</a>
          <a class="btn btn-outline-light btn-sm" th:href="@{?lang=en}" th:text="#{nav.language.en}">English</a>
          <form th:action="@{/logout}" method="post" class="d-inline">
            <button type="submit" class="btn btn-outline-light btn-sm" th:text="#{nav.logout}">ログアウト</button>
          </form>
        </div>
      </div>
    </header>

    <main class="container">
      <div
        th:if="${successMessage}"
        class="alert alert-success alert-dismissible fade show"
        role="alert"
        th:text="${successMessage}"
      >
        登録が完了しました
      </div>
      <div
        th:if="${errorMessage}"
        class="alert alert-danger alert-dismissible fade show"
        role="alert"
        th:text="${errorMessage}"
      >
        削除に失敗しました
      </div>

      <form class="row g-2 mb-3" th:action="@{/todos}" method="get">
        <div class="col-sm-6 col-md-4">
          <input
            type="text"
            class="form-control"
            name="keyword"
            th:placeholder="#{list.search.placeholder}"
            th:value="${keyword}"
          />
        </div>
        <div class="col-sm-6 col-md-3">
          <select class="form-select" name="categoryId">
            <option value="" th:text="#{form.category}">カテゴリ</option>
            <option
              th:each="c : ${categories}"
              th:value="${c.id}"
              th:text="${c.name}"
              th:selected="${categoryId != null and categoryId == c.id}"
            >
              カテゴリ
            </option>
          </select>
        </div>
        <input type="hidden" name="sort" th:value="${sort}" />
        <input type="hidden" name="direction" th:value="${direction}" />
        <div class="col-auto">
          <button type="submit" class="btn btn-outline-primary" th:text="#{list.search}">検索</button>
        </div>
        <div class="col-auto">
          <a class="btn btn-outline-secondary" th:href="@{/todos}" th:text="#{list.clear}">クリア</a>
        </div>
        <div class="col-12 text-muted small mt-1" th:if="${keyword != null and !#strings.isEmpty(keyword)}">
          <span th:text="#{list.result(${#lists.size(todos)})}">検索結果</span>
        </div>
      </form>

      <div class="text-muted small mb-2" th:if="${page != null}">
        <span th:text="#{list.range(${totalElements}, ${rangeStart}, ${rangeEnd})}">全0件中 0-0件を表示</span>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h4 mb-0" th:text="#{list.title}">ToDo 一覧</h2>
        <div class="d-flex gap-2">
          <a class="btn btn-outline-secondary" th:href="@{/todos/export}" th:text="#{list.csv}">CSVダウンロード</a>
          <a class="btn btn-primary" th:href="@{/todos/new}" th:text="#{list.new}">新規作成</a>
        </div>
      </div>

      <form
        th:action="@{/todos/bulk-delete}"
        method="post"
        th:attr="onsubmit='return confirm(\'' + #{button.confirmDelete} + '\')'"
      >
      <div th:if="${page != null and page.totalElements == 0}" class="card border-0 shadow-sm p-4 text-center">
        <h3 class="h5 mb-2" th:text="#{list.empty}">ToDoがまだ登録されていません</h3>
        <p class="text-muted mb-4" th:text="#{list.empty.sub}">まずは1件登録して、一覧に表示してみましょう。</p>
        <div>
          <a class="btn btn-primary" th:href="@{/todos/new}" th:text="#{list.new}">新規作成</a>
        </div>
      </div>

      <div th:unless="${page != null and page.totalElements == 0}" class="table-responsive">
        <table class="table table-striped table-hover align-middle">
          <thead class="table-light">
            <tr>
              <th scope="col" style="width: 36px;">
                <input type="checkbox" id="selectAll" />
              </th>
              <th scope="col">
                <a
                  class="link-dark text-decoration-none"
                  th:href="@{/todos(sort='title', direction=${(sort == 'title' and direction == 'asc') ? 'desc' : 'asc'}, keyword=${keyword}, categoryId=${categoryId})}"
                >
                  <span th:text="#{column.title}">タイトル</span>
                  <span th:if="${sort == 'title' and direction == 'asc'}">▲</span>
                  <span th:if="${sort == 'title' and direction == 'desc'}">▼</span>
                </a>
              </th>
              <th scope="col">
                <a
                  class="link-dark text-decoration-none"
                  th:href="@{/todos(sort='createdAt', direction=${(sort == 'createdAt' and direction == 'asc') ? 'desc' : 'asc'}, keyword=${keyword}, categoryId=${categoryId})}"
                >
                  <span th:text="#{column.createdAt}">作成日</span>
                  <span th:if="${sort == 'createdAt' and direction == 'asc'}">▲</span>
                  <span th:if="${sort == 'createdAt' and direction == 'desc'}">▼</span>
                </a>
              </th>
              <th scope="col">
                <a
                  class="link-dark text-decoration-none"
                  th:href="@{/todos(sort='deadline', direction=${(sort == 'deadline' and direction == 'asc') ? 'desc' : 'asc'}, keyword=${keyword}, categoryId=${categoryId})}"
                >
                  <span th:text="#{column.deadline}">期限日</span>
                  <span th:if="${sort == 'deadline' and direction == 'asc'}">▲</span>
                  <span th:if="${sort == 'deadline' and direction == 'desc'}">▼</span>
                </a>
              </th>
              <th scope="col">
                <a
                  class="link-dark text-decoration-none"
                  th:href="@{/todos(sort='priority', direction=${(sort == 'priority' and direction == 'asc') ? 'desc' : 'asc'}, keyword=${keyword}, categoryId=${categoryId})}"
                >
                  <span th:text="#{column.priority}">優先度</span>
                  <span th:if="${sort == 'priority' and direction == 'asc'}">▲</span>
                  <span th:if="${sort == 'priority' and direction == 'desc'}">▼</span>
                </a>
              </th>
              <th scope="col" th:text="#{column.category}">カテゴリ</th>
              <th scope="col">
                <a
                  class="link-dark text-decoration-none"
                  th:href="@{/todos(sort='completed', direction=${(sort == 'completed' and direction == 'asc') ? 'desc' : 'asc'}, keyword=${keyword}, categoryId=${categoryId})}"
                >
                  <span th:text="#{column.status}">ステータス</span>
                  <span th:if="${sort == 'completed' and direction == 'asc'}">▲</span>
                  <span th:if="${sort == 'completed' and direction == 'desc'}">▼</span>
                </a>
              </th>
              <th scope="col" class="text-end" th:text="#{column.actions}">操作</th>
            </tr>
          </thead>
          <tbody>
            <tr
              th:each="todo : ${todos}"
              th:classappend="${todo.overdue} ? ' overdue-row' : (${todo.nearDeadline} ? ' warning-row' : '')"
            >
              <td>
                <input type="checkbox" name="ids" th:value="${todo.id}" class="row-check" />
              </td>
              <td>
                <span th:text="${todo.title}" th:classappend="${todo.completed} ? ' text-decoration-line-through text-muted' : ''">Sample</span>
              </td>
              <td>
                <span th:text="${#temporals.format(todo.createdAt, 'yyyy/MM/dd')}">2026/02/04</span>
              </td>
              <td>
                <span
                  th:text="${todo.deadline != null} ? ${#temporals.format(todo.deadline, 'yyyy/MM/dd')} : #{priority.unset}"
                  >2026/02/04</span
                >
              </td>
              <td>
                <span
                  class="badge"
                  th:classappend="${todo.priority != null} ? ' ' + ${todo.priority.badgeClass} : ''"
                  th:text="${todo.priority != null} ? ${todo.priority.label} : #{priority.unset}"
                >
                  中
                </span>
              </td>
              <td>
                <span
                  class="badge"
                  th:classappend="${todo.category != null} ? ' ' + ${todo.category.color} : ''"
                  th:text="${todo.category != null} ? ${todo.category.name} : #{category.unset}"
                >
                  未設定
                </span>
              </td>
              <td>
                <form th:action="@{/todos/{id}/toggle(id=${todo.id})}" method="post" class="d-inline toggle-form">
                  <button type="submit" class="btn btn-sm btn-outline-success">
                    <span th:if="${todo.completed}" th:text="#{status.done}">完了</span>
                    <span th:unless="${todo.completed}" th:text="#{status.todo}">未完</span>
                  </button>
                </form>
              </td>
              <td class="text-end">
                <a class="btn btn-sm btn-outline-secondary" th:href="@{/todos/{id}(id=${todo.id})}" th:text="#{button.detail}">詳細</a>
                <a class="btn btn-sm btn-outline-primary" th:href="@{/todos/{id}/edit(id=${todo.id})}" th:text="#{button.edit}">編集</a>
                <form th:action="@{/todos/{id}/delete(id=${todo.id})}" method="post" class="d-inline">
                  <button
                    type="submit"
                    class="btn btn-sm btn-outline-danger"
                    th:attr="onclick='return confirm(\'' + #{button.confirmDelete} + '\')'"
                    th:text="#{button.delete}"
                  >
                    削除
                  </button>
                </form>
                <button
                  type="button"
                  class="btn btn-sm btn-outline-danger ms-1"
                  data-bs-toggle="modal"
                  data-bs-target="#deleteModal"
                  th:attr="data-id=${todo.id},data-title=${todo.title}"
                  th:text="#{button.delete.modal}"
                >
                  モーダル削除
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="d-flex justify-content-end mt-2">
        <button type="submit" class="btn btn-danger" th:text="#{list.bulkDelete}">選択した項目を削除</button>
      </div>
      </form>

      <nav aria-label="pagination" th:if="${page != null and page.totalPages > 1}">
        <ul class="pagination justify-content-center mt-3">
          <li class="page-item" th:classappend="${page.first} ? ' disabled' : ''">
            <a
              class="page-link"
              th:href="@{/todos(page=${page.number - 1}, size=${page.size}, sort=${sort}, direction=${direction}, keyword=${keyword}, categoryId=${categoryId})}"
            >
              <span>Prev</span>
            </a>
          </li>
          <li
            class="page-item"
            th:each="p : ${#numbers.sequence(1, page.totalPages)}"
            th:classappend="${p - 1 == page.number} ? ' active' : ''"
          >
            <a
              class="page-link"
              th:href="@{/todos(page=${p - 1}, size=${page.size}, sort=${sort}, direction=${direction}, keyword=${keyword}, categoryId=${categoryId})}"
              th:text="${p}"
            >
              1
            </a>
          </li>
          <li class="page-item" th:classappend="${page.last} ? ' disabled' : ''">
            <a
              class="page-link"
              th:href="@{/todos(page=${page.number + 1}, size=${page.size}, sort=${sort}, direction=${direction}, keyword=${keyword}, categoryId=${categoryId})}"
            >
              <span>Next</span>
            </a>
          </li>
        </ul>
      </nav>
      <div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" th:text="#{button.delete}">削除</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <p class="mb-0">
                「<span id="deleteModalTitle"></span>」<span th:text="#{button.confirmDelete}">本当に削除しますか？</span>
              </p>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" th:text="#{form.back}">戻る</button>
              <form id="deleteModalForm" method="post">
                <input type="hidden" name="_method" value="delete" />
                <button type="submit" class="btn btn-danger" th:text="#{button.delete}">削除</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="bg-white border-top py-3 mt-5">
      <div class="container text-muted small">&copy; 2026 ToDo App</div>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script>
      document.querySelectorAll(".toggle-form[data-ajax='true']").forEach((form) => {
        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          try {
            const response = await fetch(form.action, { method: "POST" });
            if (response.ok) {
              window.location.reload();
            }
          } catch (err) {
            console.error(err);
          }
        });
      });

      const alerts = document.querySelectorAll(".alert");
      alerts.forEach((alert) => {
        setTimeout(() => {
          alert.classList.remove("show");
          alert.classList.add("hide");
        }, 3000);
      });

      const deleteModal = document.getElementById("deleteModal");
      if (deleteModal) {
        deleteModal.addEventListener("show.bs.modal", (event) => {
          const button = event.relatedTarget;
          const id = button.getAttribute("data-id");
          const title = button.getAttribute("data-title");
          const titleSpan = document.getElementById("deleteModalTitle");
          const form = document.getElementById("deleteModalForm");
          titleSpan.textContent = title || "";
          form.action = `/todos/${id}`;
        });
      }

      const selectAll = document.getElementById("selectAll");
      if (selectAll) {
        selectAll.addEventListener("change", (e) => {
          document.querySelectorAll(".row-check").forEach((cb) => {
            cb.checked = e.target.checked;
          });
        });
      }
    </script>
  </body>
</html>
