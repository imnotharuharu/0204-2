<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ToDo List</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body class="bg-light">
    <header class="bg-dark text-white py-3 mb-4">
      <div class="container">
        <h1 class="h3 mb-0">ToDo App</h1>
      </div>
    </header>

    <main class="container">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h4 mb-0">ToDo 一覧</h2>
        <a class="btn btn-primary" th:href="@{/todos/new}">新規作成</a>
      </div>

      <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
          <thead class="table-light">
            <tr>
              <th scope="col">ID</th>
              <th scope="col">タイトル</th>
              <th scope="col">期限</th>
              <th scope="col">状態</th>
              <th scope="col" class="text-end">操作</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="todo : ${todos}">
              <td th:text="${todo.id}">1</td>
              <td th:text="${todo.title}">サンプル</td>
              <td th:text="${todo.dueDate}">2026-02-04</td>
              <td>
                <span
                  class="badge"
                  th:classappend="${todo.done} ? ' bg-success' : ' bg-secondary'"
                  th:text="${todo.done} ? '完了' : '未完了'"
                  >未完了</span
                >
              </td>
              <td class="text-end">
                <a class="btn btn-sm btn-outline-secondary" th:href="@{/todos/{id}(id=${todo.id})}">詳細</a>
                <a class="btn btn-sm btn-outline-primary" th:href="@{/todos/{id}/edit(id=${todo.id})}">編集</a>
                <a class="btn btn-sm btn-outline-danger" th:href="@{/todos/{id}/delete(id=${todo.id})}">削除</a>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(todos)}">
              <td colspan="5" class="text-center text-muted">ToDo はまだありません。</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>

    <footer class="bg-white border-top py-3 mt-5">
      <div class="container text-muted small">&copy; 2026 ToDo App</div>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
