<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ToDo List</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body class="bg-light">
    <header class="bg-dark text-white py-3 mb-4">
      <div class="container">
        <h1 class="h3 mb-0">ToDo App</h1>
      </div>
    </header>

    <main class="container">
      <div
        th:if="${successMessage}"
        class="alert alert-success alert-dismissible fade show"
        role="alert"
        th:text="${successMessage}"
      >
        登録が完了しました
      </div>
      <div
        th:if="${errorMessage}"
        class="alert alert-danger alert-dismissible fade show"
        role="alert"
        th:text="${errorMessage}"
      >
        削除に失敗しました
      </div>

      <form class="row g-2 mb-3" th:action="@{/todos}" method="get">
        <div class="col-sm-8 col-md-6">
          <input
            type="text"
            class="form-control"
            name="keyword"
            placeholder="タイトルで検索"
            th:value="${keyword}"
          />
        </div>
        <div class="col-auto">
          <button type="submit" class="btn btn-outline-primary">検索</button>
        </div>
        <div class="col-auto">
          <a class="btn btn-outline-secondary" th:href="@{/todos}">クリア</a>
        </div>
        <div class="col-12 text-muted small mt-1" th:if="${keyword != null and !#strings.isEmpty(keyword)}">
          検索結果: <span th:text="${#lists.size(todos)}">0</span> 件
        </div>
      </form>

      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h4 mb-0">ToDo 一覧</h2>
        <a class="btn btn-primary" th:href="@{/todos/new}">新規作成</a>
      </div>

      <div th:if="${#lists.isEmpty(todos)}" class="card border-0 shadow-sm p-4 text-center">
        <h3 class="h5 mb-2">ToDoがまだ登録されていません</h3>
        <p class="text-muted mb-4">まずは1件登録して、一覧に表示してみましょう。</p>
        <div>
          <a class="btn btn-primary" th:href="@{/todos/new}">新規作成</a>
        </div>
      </div>

      <div th:unless="${#lists.isEmpty(todos)}" class="table-responsive">
        <table class="table table-striped table-hover align-middle">
          <thead class="table-light">
            <tr>
              <th scope="col">
                <a
                  class="link-dark text-decoration-none"
                  th:href="@{/todos(sort='title', direction=${(sort == 'title' and direction == 'asc') ? 'desc' : 'asc'}, keyword=${keyword})}"
                >
                  タイトル
                  <span th:if="${sort == 'title' and direction == 'asc'}">▲</span>
                  <span th:if="${sort == 'title' and direction == 'desc'}">▼</span>
                </a>
              </th>
              <th scope="col">
                <a
                  class="link-dark text-decoration-none"
                  th:href="@{/todos(sort='createdAt', direction=${(sort == 'createdAt' and direction == 'asc') ? 'desc' : 'asc'}, keyword=${keyword})}"
                >
                  作成日
                  <span th:if="${sort == 'createdAt' and direction == 'asc'}">▲</span>
                  <span th:if="${sort == 'createdAt' and direction == 'desc'}">▼</span>
                </a>
              </th>
              <th scope="col">期限日</th>
              <th scope="col">優先度</th>
              <th scope="col">
                <a
                  class="link-dark text-decoration-none"
                  th:href="@{/todos(sort='completed', direction=${(sort == 'completed' and direction == 'asc') ? 'desc' : 'asc'}, keyword=${keyword})}"
                >
                  ステータス
                  <span th:if="${sort == 'completed' and direction == 'asc'}">▲</span>
                  <span th:if="${sort == 'completed' and direction == 'desc'}">▼</span>
                </a>
              </th>
              <th scope="col" class="text-end">操作</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="todo : ${todos}">
              <td>
                <span th:text="${todo.title}" th:classappend="${todo.completed} ? ' text-decoration-line-through text-muted' : ''">サンプル</span>
              </td>
              <td>
                <span th:text="${#temporals.format(todo.createdAt, 'yyyy/MM/dd')}">2026/02/04</span>
              </td>
              <td>
                <span
                  th:text="${todo.dueDate != null} ? ${#temporals.format(todo.dueDate, 'yyyy/MM/dd')} : '未設定'"
                  th:classappend="${todo.dueDate != null and todo.dueDate.isBefore(T(java.time.LocalDate).now())} ? ' text-danger' : ''"
                  >2026/02/04</span
                >
              </td>
              <td>
                <span th:if="${todo.priority != null}">
                  <span th:each="i : ${#numbers.sequence(1, todo.priority)}">★</span>
                </span>
                <span th:if="${todo.priority == null}" class="text-muted">-</span>
              </td>
              <td>
                <!-- Non-ajax (standard) toggle -->
                <form th:action="@{/todos/{id}/toggle(id=${todo.id})}" method="post" class="d-inline toggle-form">
                  <button type="submit" class="btn btn-sm btn-outline-success">
                    <span th:if="${todo.completed}">✓</span>
                    <span th:unless="${todo.completed}">未完</span>
                  </button>
                </form>
              </td>
              <td class="text-end">
                <a class="btn btn-sm btn-outline-secondary" th:href="@{/todos/{id}(id=${todo.id})}">詳細</a>
                <a class="btn btn-sm btn-outline-primary" th:href="@{/todos/{id}/edit(id=${todo.id})}">編集</a>
                <form th:action="@{/todos/{id}/delete(id=${todo.id})}" method="post" class="d-inline">
                  <button
                    type="submit"
                    class="btn btn-sm btn-outline-danger"
                    onclick="return confirm('本当に削除しますか？')"
                  >
                    削除
                  </button>
                </form>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>

    <footer class="bg-white border-top py-3 mt-5">
      <div class="container text-muted small">&copy; 2026 ToDo App</div>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script>
      // Optional AJAX toggle: add data-ajax="true" to enable.
      document.querySelectorAll(".toggle-form[data-ajax='true']").forEach((form) => {
        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          try {
            const response = await fetch(form.action, { method: "POST" });
            if (response.ok) {
              window.location.reload();
            }
          } catch (err) {
            console.error(err);
          }
        });
      });

      const alerts = document.querySelectorAll(".alert");
      alerts.forEach((alert) => {
        setTimeout(() => {
          alert.classList.remove("show");
          alert.classList.add("hide");
        }, 3000);
      });
    </script>
  </body>
</html>
